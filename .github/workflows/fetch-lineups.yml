name: Fetch Opta Lineups

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Download Opta lineups
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -o opta_lineups.parquet \
            "https://github.com/peteowen1/pannadata/releases/download/opta-latest/opta_lineups.parquet"

      - name: Convert EPL lineups to CSV
        run: |
          python -m pip install --quiet pyarrow pandas

          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet("opta_lineups.parquet")

          print("Competitions:", df["competition"].unique())
          print("Seasons:", sorted(df["season"].dropna().astype(str).unique()))

          seasons = [
              "2021-2022",
              "2022-2023",
              "2023-2024",
              "2024-2025",
              "2025-2026"
          ]

          df = df[
              (df["competition"].astype(str) == "EPL") &
              (df["season"].astype(str).isin(seasons))
          ].copy()

          df.to_csv("opta_lineups_2021_2026.csv", index=False)

          print("EPL rows:", len(df))
          print("Matches:", df["match_id"].nunique())
          print(df.groupby("season")["match_id"].nunique())
          PY

      - name: Upload lineup data
        uses: actions/upload-artifact@v4
        with:
          name: opta-lineups
          path: |
            opta_lineups.parquet
            opta_lineups_2021_2026.csv
          retention-days: 7
