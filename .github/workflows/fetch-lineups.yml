name: Fetch Opta Lineups and FIFA Ratings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. SETUP
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow requests

      # =========================================================
      # 2. DOWNLOAD OPTA LINEUPS
      # =========================================================

      - name: Download Opta lineups
        run: |
          python - <<'PY'
          import requests

          url = (
              "https://github.com/peteowen1/pannadata/"
              "releases/download/opta-latest/opta_lineups.parquet"
          )

          print("Downloading Opta lineups...")

          r = requests.get(url, timeout=300)
          r.raise_for_status()

          with open("opta_lineups.parquet", "wb") as f:
              f.write(r.content)

          print("Downloaded bytes:", len(r.content))
          PY

      # =========================================================
      # 3. FILTER EPL LINEUPS
      # =========================================================

      - name: Convert EPL lineups to CSV
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet("opta_lineups.parquet")

          seasons = [
              "2021-2022",
              "2022-2023",
              "2023-2024",
              "2024-2025",
              "2025-2026",
          ]

          df = df[
              (df["competition"].astype(str) == "EPL")
              & (df["season"].astype(str).isin(seasons))
          ].copy()

          df.to_csv(
              "opta_lineups_2021_2026.csv",
              index=False
          )

          print("EPL lineup rows:", len(df))
          print("Unique matches:", df["match_id"].nunique())
          print("Unique players:", df["player_id"].nunique())

          print("\nMatches by season:")

          print(
              df.groupby("season")["match_id"]
                .nunique()
                .sort_index()
          )
          PY

      # =========================================================
      # 4. DOWNLOAD HISTORICAL FIFA / EA RATINGS
      # =========================================================

      - name: Download historical FIFA and EA ratings
        run: |
          mkdir -p ratings_raw

          python - <<'PY'
          import requests
          from pathlib import Path

          datasets = {

              # FIFA 22
              "fifa22":
                  "https://raw.githubusercontent.com/"
                  "MakuG/fifa22/main/players_22.csv",

              # FIFA 23
              "fifa23":
                  "https://raw.githubusercontent.com/"
                  "miraehab/FIFA-23-ML-Project/main/"
                  "players_fifa23.csv",

              # EA FC 24
              "fc24":
                  "https://raw.githubusercontent.com/"
                  "federicopaschetta/FootballPlayersAnalysis/"
                  "main/male_players.csv",

              # EA FC 25
              "fc25":
                  "https://raw.githubusercontent.com/"
                  "Rayen-khammessi/"
                  "Football-Data-Engineering-Analytics-Project-"
                  "EA-Sports-FC-25/main/male_players.csv",

              # EA FC 26
              "fc26":
                  "https://raw.githubusercontent.com/"
                  "preetiravikiran/FIFA2026/main/"
                  "fifa26_player_data.csv",
          }

          Path("ratings_raw").mkdir(exist_ok=True)

          failures = []

          for name, url in datasets.items():

              print()
              print("=" * 60)
              print("Downloading:", name)
              print(url)

              try:

                  r = requests.get(
                      url,
                      timeout=300
                  )

                  print("HTTP:", r.status_code)
                  print("Bytes:", len(r.content))

                  if not r.ok:
                      failures.append(
                          f"{name}: HTTP {r.status_code}"
                      )
                      continue

                  if len(r.content) < 1000:
                      failures.append(
                          f"{name}: file too small"
                      )
                      continue

                  path = (
                      Path("ratings_raw")
                      / f"{name}.csv"
                  )

                  path.write_bytes(r.content)

                  print("Saved:", path)

              except Exception as exc:

                  failures.append(
                      f"{name}: {exc}"
                  )

          print()
          print("=" * 60)

          if failures:

              print("DOWNLOAD FAILURES:")

              for failure in failures:
                  print(failure)

              raise RuntimeError(
                  "One or more rating datasets failed."
              )

          print(
              "All five rating datasets "
              "downloaded successfully."
          )
          PY

      # =========================================================
      # 5. INSPECT RAW FILES
      # =========================================================

      - name: Inspect raw rating datasets
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          for file in sorted(
              Path("ratings_raw").glob("*.csv")
          ):

              print()
              print("=" * 70)
              print(file)
              print("=" * 70)

              df = pd.read_csv(
                  file,
                  low_memory=False
              )

              print("Rows:", len(df))

              print("Columns:")
              print(list(df.columns))

              print()
              print(df.head(2).to_string())
          PY

      # =========================================================
      # 6. STANDARDISE ALL FIVE RATINGS FILES
      # =========================================================

      - name: Standardise player rating datasets
        run: |
          python - <<'PY'
          import pandas as pd
          import numpy as np
          import re
          from pathlib import Path

          season_map = {
              "fifa22": "2021-2022",
              "fifa23": "2022-2023",
              "fc24":   "2023-2024",
              "fc25":   "2024-2025",
              "fc26":   "2025-2026",
          }


          def find_col(df, candidates):

              lookup = {
                  str(c).strip().lower(): c
                  for c in df.columns
              }

              for candidate in candidates:

                  key = candidate.strip().lower()

                  if key in lookup:
                      return lookup[key]

              return None


          def id_from_url(value):

              if pd.isna(value):
                  return np.nan

              match = re.search(
                  r"/(\d+)(?:/)?$",
                  str(value)
              )

              if match:
                  return match.group(1)

              return np.nan


          outputs = []

          required_versions = set(
              season_map.keys()
          )

          available_versions = {
              p.stem
              for p in Path(
                  "ratings_raw"
              ).glob("*.csv")
          }

          missing_versions = (
              required_versions
              - available_versions
          )

          if missing_versions:

              raise RuntimeError(
                  "Missing raw rating files: "
                  + str(
                      sorted(
                          missing_versions
                      )
                  )
              )


          for file in sorted(
              Path("ratings_raw").glob("*.csv")
          ):

              version = file.stem

              if version not in season_map:
                  continue

              print()
              print("=" * 60)
              print("Processing:", version)

              df = pd.read_csv(
                  file,
                  low_memory=False
              )

              name_col = find_col(
                  df,
                  [
                      "short_name",
                      "name",
                      "player_name",
                      "fullname",
                      "full_name",
                      "long_name",
                      "Name",
                  ],
              )

              full_name_col = find_col(
                  df,
                  [
                      "long_name",
                      "full_name",
                      "fullname",
                      "FullName",
                  ],
              )

              overall_col = find_col(
                  df,
                  [
                      "overall",
                      "Overall",
                      "ovr",
                      "OVR",
                      "overall_rating",
                      "rating",
                      "ova",
                  ],
              )

              club_col = find_col(
                  df,
                  [
                      "club_name",
                      "club",
                      "Club",
                      "team",
                      "Team",
                      "team_name",
                  ],
              )

              position_col = find_col(
                  df,
                  [
                      "player_positions",
                      "positions",
                      "Positions",
                      "position",
                      "Position",
                      "best_position",
                      "BestPosition",
                  ],
              )

              player_id_col = find_col(
                  df,
                  [
                      "sofifa_id",
                      "player_id",
                      "id",
                      "ID",
                  ],
              )

              url_col = find_col(
                  df,
                  [
                      "url",
                      "URL",
                      "player_url",
                  ],
              )

              print(
                  "Name column:",
                  name_col
              )

              print(
                  "Full name column:",
                  full_name_col
              )

              print(
                  "Overall column:",
                  overall_col
              )

              print(
                  "Club column:",
                  club_col
              )

              print(
                  "Position column:",
                  position_col
              )

              print(
                  "Player ID column:",
                  player_id_col
              )

              if name_col is None:

                  raise RuntimeError(
                      f"{version}: "
                      "player name column not found."
                  )

              if overall_col is None:

                  raise RuntimeError(
                      f"{version}: "
                      "overall rating column not found."
                  )

              # IMPORTANT:
              # Initialise with df.index so scalar season
              # assignments populate every row correctly.

              out = pd.DataFrame(
                  index=df.index
              )

              out["season"] = (
                  season_map[version]
              )

              out["rating_version"] = (
                  version
              )

              if player_id_col is not None:

                  out[
                      "rating_player_id"
                  ] = df[player_id_col]

              elif url_col is not None:

                  out[
                      "rating_player_id"
                  ] = df[url_col].apply(
                      id_from_url
                  )

              else:

                  out[
                      "rating_player_id"
                  ] = np.nan

              out["player_name"] = (
                  df[name_col]
              )

              if full_name_col is not None:

                  out["full_name"] = (
                      df[full_name_col]
                  )

              else:

                  out["full_name"] = (
                      df[name_col]
                  )

              if club_col is not None:

                  out["club"] = (
                      df[club_col]
                  )

              else:

                  out["club"] = np.nan

              if position_col is not None:

                  out["position"] = (
                      df[position_col]
                  )

              else:

                  out["position"] = np.nan

              out["overall"] = (
                  pd.to_numeric(
                      df[overall_col],
                      errors="coerce"
                  )
              )

              out = out[
                  out["player_name"].notna()
                  & out["overall"].notna()
              ].copy()

              print(
                  "Standardised rows:",
                  len(out)
              )

              print(
                  "Overall range:",
                  out["overall"].min(),
                  "-",
                  out["overall"].max()
              )

              outputs.append(out)


          ratings = pd.concat(
              outputs,
              ignore_index=True
          )

          ratings[
              "rating_player_id"
          ] = ratings[
              "rating_player_id"
          ].astype(str).replace(
              {
                  "nan": "",
                  "None": "",
              }
          )

          ratings.to_csv(
              "player_ratings_2021_2026.csv",
              index=False
          )


          print()
          print("=" * 70)
          print("FINAL RATINGS FILE")
          print("=" * 70)

          print(
              "Rows:",
              len(ratings)
          )

          print()
          print("Rows by season:")

          counts = (
              ratings.groupby("season")
              .size()
              .sort_index()
          )

          print(counts)

          expected_seasons = set(
              season_map.values()
          )

          actual_seasons = set(
              ratings["season"]
              .dropna()
              .astype(str)
              .unique()
          )

          missing = (
              expected_seasons
              - actual_seasons
          )

          if missing:

              raise RuntimeError(
                  "Missing standardised seasons: "
                  + str(sorted(missing))
              )

          print()
          print("Rating summary:")

          print(
              ratings.groupby(
                  "season"
              )["overall"].agg(
                  [
                      "count",
                      "mean",
                      "median",
                      "min",
                      "max",
                  ]
              )
          )

          print()
          print(
              "All five rating seasons "
              "standardised successfully."
          )
          PY

      # =========================================================
      # 7. EPL PLAYER COVERAGE PRE-CHECK
      # =========================================================

      - name: Validate EPL rating coverage
        run: |
          python - <<'PY'
          import pandas as pd

          lineups = pd.read_csv(
              "opta_lineups_2021_2026.csv",
              low_memory=False
          )

          ratings = pd.read_csv(
              "player_ratings_2021_2026.csv",
              low_memory=False
          )

          print()
          print("OPTA")
          print("----")

          print(
              "Rows:",
              len(lineups)
          )

          print(
              "Unique players:",
              lineups["player_id"].nunique()
          )

          print()
          print("RATINGS")
          print("-------")

          print(
              "Rows:",
              len(ratings)
          )

          print()
          print(
              ratings.groupby(
                  "season"
              ).size()
          )

          if len(lineups) == 0:

              raise RuntimeError(
                  "Opta lineup file is empty."
              )

          if len(ratings) == 0:

              raise RuntimeError(
                  "Player ratings file is empty."
              )

          if (
              ratings["season"]
              .nunique()
              != 5
          ):

              raise RuntimeError(
                  "Expected exactly "
                  "five rating seasons."
              )

          print()
          print(
              "VALIDATION PASSED"
          )
          PY

      # =========================================================
      # 8. UPLOAD ARTIFACT
      # =========================================================

      - name: Upload modelling data
        uses: actions/upload-artifact@v4
        with:
          name: epl-lineups-and-ratings
          path: |
            opta_lineups_2021_2026.csv
            player_ratings_2021_2026.csv
            ratings_raw/*.csv
          retention-days: 7
