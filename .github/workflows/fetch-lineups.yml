name: Fetch Opta Lineups

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Download Opta lineups
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -o opta_lineups.parquet \
            "https://github.com/peteowen1/pannadata/releases/download/opta-latest/opta_lineups.parquet"

      - name: Convert lineups to CSV
        run: |
          python -m pip install --quiet pyarrow pandas

          python - <<'PY'
          import pandas as pd

          df = pd.read_parquet("opta_lineups.parquet")

          df["match_date"] = pd.to_datetime(
              df["match_date"],
              errors="coerce"
          )

          # Only the five seasons needed for our test
          df = df[
              (df["match_date"] >= "2021-08-01") &
              (df["match_date"] < "2026-07-01")
          ]

          df.to_csv(
              "opta_lineups_2021_2026.csv",
              index=False
          )

          print("Rows:", len(df))
          print(df.columns.tolist())
          PY

      - name: Upload lineup data
        uses: actions/upload-artifact@v4
        with:
          name: opta-lineups
          path: |
            opta_lineups.parquet
            opta_lineups_2021_2026.csv
          retention-days: 7
